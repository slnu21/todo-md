[package]
name = "todo-md"
version = "0.3.0"
description = "TODO.md — docked to-do strip with a memo log and Markdown weekly reports"
authors = ["slnu21"]
repository = "https://github.com/slnu21/todo-md"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "todo_md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "~2.12.0", features = ["tray-icon"] }
tauri-plugin-dialog = "~2.7.0"

# Tauri 가 이미 쓰는 0.62 — 도킹(AppBar)·모니터·DPI 를 Win32 로 직접 부른다(appbar.rs)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# 늘 떠 있는 작은 앱 — 배포 크기가 중요하다
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
